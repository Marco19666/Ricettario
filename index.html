<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e85d04">
  <meta name="description" content="Cerca, salva e consulta le tue ricette offline">
  <title>Ricettario</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <button id="btn-home" class="icon-btn" aria-label="Torna alla ricerca" hidden>←</button>
    <h1 id="app-title">Ricettario</h1>
    <a href="#saved" class="icon-btn" aria-label="Ricette salvate">♥</a>
  </header>

  <main>
    <section id="view-search" class="view">
      <form id="search-form" class="search-bar" autocomplete="off">
        <input type="search" id="search-input" placeholder="Cerca una ricetta (es. carbonara)" required>
        <button type="submit">Cerca</button>
      </form>
      <p class="hint">Suggerimenti: prova "carbonara", "pesto", "tiramisù", "zucca".</p>
    </section>

    <section id="view-results" class="view" hidden>
      <div id="results-grid" class="grid"></div>
    </section>

    <section id="view-detail" class="view" hidden>
      <div class="tiles">
        <article class="tile tile-title">
          <h2 id="r-title"></h2>
          <p id="r-meta" class="meta"></p>
        </article>
        <article class="tile tile-photo">
          <img id="r-photo" alt="">
        </article>
        <article class="tile tile-ingredients">
          <h3>Ingredienti</h3>
          <ul id="r-ingredients"></ul>
        </article>
        <article class="tile tile-preparation">
          <h3>Preparazione</h3>
          <div id="r-instructions"></div>
        </article>
      </div>
      <div class="actions">
        <button id="btn-accept" type="button" class="primary">Accetta e salva</button>
        <button id="btn-reject" type="button">Scarta</button>
      </div>
    </section>

    <section id="view-saved" class="view" hidden>
      <div id="saved-grid" class="grid"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
